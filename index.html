<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beauty Studio | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/iniciostyle.css">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#" style="color: var(--primary-color);">
            <img src="./imagenes/logo 1.png" width="35" height="35" class="me-2"> BEAUTY STUDIO
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active fw-bold" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="pagina.html">Tips</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="bg-dark text-white p-2 text-center small">
    🔥 CUPONES: <span class="text-warning">BIENVENIDA (10%)</span> | <span class="text-info">MAQUILLAJE20 (20%)</span> | <span class="text-danger">PRO50 (50%)</span> 🔥
</div>

<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active"><img src="./imagenes/maquillaje 1.jpg" class="d-block w-100 tamano"></div>
        <div class="carousel-item"><img src="./imagenes/maquillaje 6.jpg" class="d-block w-100 tamano"></div>
        <div class="carousel-item"><img src="./imagenes/maquillaje 3.jpg" class="d-block w-100 tamano"></div>
    </div>
</div>

<div class="container my-5">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="admin-card">
                <h4 class="fw-bold mb-4">Nuevo Producto</h4>
                <form id="productForm">
                    <div class="mb-3"><label class="small fw-bold">URL Imagen</label><input type="url" id="imgInp" class="form-control" required></div>
                    <div class="mb-3"><label class="small fw-bold">Nombre</label><input type="text" id="titleInp" class="form-control" required></div>
                    <div class="mb-3"><label class="small fw-bold">Descripción</label><textarea id="descInp" class="form-control" rows="2" required></textarea></div>
                    <div class="row">
                        <div class="col-6 mb-3"><label class="small fw-bold">Precio</label><input type="number" id="priceInp" class="form-control" required></div>
                        <div class="col-6 mb-3"><label class="small fw-bold">Cupón</label><input type="text" id="couponInp" class="form-control"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold mt-2" style="background: var(--primary-color); border:none;">GUARDAR</button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Nuestros Productos</h3>
                <span class="badge bg-secondary rounded-pill" id="countBadge">0 Productos</span>
            </div>
            <div id="contenedor-productos"></div>
        </div>
    </div>
</div>

<footer class="py-4 bg-white border-top text-center mt-5">
    <p class="text-muted small m-0">© 2026 Beauty Studio por <strong>Sofia Hernández</strong></p>
</footer>

<script>
    const productForm = document.getElementById('productForm');
    const container = document.getElementById('contenedor-productos');
    const countBadge = document.getElementById('countBadge');
    let productCount = 0;

    const CUPONES = { 'BIENVENIDA': 0.10, 'MAQUILLAJE20': 0.20, 'PRO50': 0.50 };

    // Productos de muestra
    const iniciales = [
        { img: "./imagenes/maquillaje 1.jpg", title: "Paleta Nude", desc: "12 tonos mate de alta pigmentación.", price: 45000 },
        { img: "./imagenes/maquillaje 6.jpg", title: "Labial Velvet", desc: "Acabado aterciopelado de 24h.", price: 25000 }
    ];

    window.onload = () => {
        iniciales.forEach(p => renderCard(p.img, p.title, p.desc, p.price, p.price, ""));
    };

    productForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const img = document.getElementById('imgInp').value;
        const title = document.getElementById('titleInp').value;
        const desc = document.getElementById('descInp').value;
        const price = parseFloat(document.getElementById('priceInp').value);
        const coupon = document.getElementById('couponInp').value.trim().toUpperCase();

        let finalPrice = price;
        let tag = "";

        if (CUPONES[coupon]) {
            finalPrice = price * (1 - CUPONES[coupon]);
            tag = `<span class="badge bg-danger">-${CUPONES[coupon]*100}% OFF</span>`;
        }

        renderCard(img, title, desc, price, finalPrice, tag);
        productForm.reset();
    });

    function renderCard(img, title, desc, oldP, newP, tag) {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
            <button class="btn-delete">✕</button>
            <div class="product-img-container"><img src="${img}" onerror="this.src='https://placehold.co/400x300?text=Beauty'"></div>
            <div class="p-3">
                <div class="d-flex justify-content-between align-items-start mb-1"><h6 class="fw-bold m-0">${title}</h6>${tag}</div>
                <p class="text-muted small mb-2">${desc}</p>
                <div class="d-flex align-items-center">
                    ${oldP !== newP ? `<span class="old-price">$${oldP.toLocaleString()}</span>` : ''}
                    <span class="price-tag">$${newP.toLocaleString()}</span>
                </div>
            </div>`;
        
        div.querySelector('.btn-delete').onclick = () => { div.remove(); productCount--; updateCount(); };
        container.appendChild(div);
        productCount++;
        updateCount();
    }

    function updateCount() { countBadge.innerText = `${productCount} Productos`; }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
